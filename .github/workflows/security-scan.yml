name: security-scan — Trivy + Syft + Grype + Semgrep on PR, push, schedule and manual dispatch

# Issue #715 (parent #713). Every scanner runs from ITS OWN immutable image, named by
# containers/scanners/digests.json (a content hash of the Dockerfile, built by this repository —
# issue #714). Nothing is installed at scan time and no `uses:` here floats on a tag.
#
# Trigger surface: pull_request (main), push to main, schedule daily 04:05 UTC (its own odd minute —
#                  no bot shares a cron slot, issue #275), and workflow_dispatch — the manual form is available to the owner,
#                  the repository bot and any collaborator with write access (the `guard` job).
# Flow: guard (owner / repository bot on a same-repo head / collaborator with write, BEFORE any
#       scanner runs) -> make check-security-scan (policy + digests sane) -> make security-scan-all
#       (Syft SBOM, then Trivy, Grype and Semgrep from their pinned images) -> make
#       security-verdict MODE=<pr|full> -> upload SARIF + the CycloneDX SBOM artifact.
# Never: never merges, never pushes, never installs a scanner, never runs a scanner from a floating
#        tag, and never needs a scanner secret: no scanner takes one.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "5 4 * * *"    # daily 04:05 UTC — its own odd minute (issue #275: no bot shares a slot)
  workflow_dispatch:
    inputs:
      tools:
        description: "Which scanners to run: all, or one of syft / trivy / grype / semgrep"
        type: choice
        options: [all, syft, trivy, grype, semgrep]
        default: all
      enforce:
        description: "Failure policy: full (fail on critical+high with a fix) or pr (critical only)"
        type: choice
        options: [full, pr]
        default: full

permissions:
  contents: read

concurrency:
  # A bot never cancels an in-progress run (issue #275): the group is this workflow's own, and
  # `cancel-in-progress` is false so a second scan waits instead of killing one mid-upload.
  group: security-scan
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  scan:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      security-events: write   # SARIF upload, scoped to this job only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: make check-security-scan (policy + pinned scanner refs must be sane)
        run: make check-security-scan

      - name: make security-scan-all (or one tool from the dispatch input)
        run: |
          set -euo pipefail
          tools="${{ github.event.inputs.tools || 'all' }}"
          if [ "$tools" = "all" ]; then
            make security-scan-all
          else
            make sbom
            make security-scan TOOL="$tools"
          fi

      - name: make security-verdict (full on schedule/push/manual, pr on a pull_request)
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.enforce || '' }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then MODE=pr; else MODE=full; fi
          fi
          make security-verdict MODE="$MODE"

      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('security-reports/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: security-reports/trivy.sarif
          category: trivy

      - name: Upload the CycloneDX SBOM and the scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn
