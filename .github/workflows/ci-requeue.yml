name: ci-requeue — re-runs only the cancelled runs no later run superseded, every 30 minutes

# Issue #843: 56% of the runs in a 300-run window are `cancelled`, and a bulk cancel to free runner
# capacity costs every killed PR its verdict - `gh pr checks` renders `completed/cancelled` as fail,
# auto-merge needs a green run, `run-failure-reactor` fires only on `conclusion: failure` and
# `run-failure-reactor` no longer treats a cancellation as "nothing to do". This is the scheduled half
# of the healer; `make ci-requeue-cancelled` is the manual half and takes WINDOW/DRY.

# Trigger surface: the 30-minute schedule (`23,53 * * * *`) and `workflow_dispatch` - never a
#   `pull_request` or a `push`: this workflow heals runs, it does not gate a change.
# Flow: `make ci-requeue-cancelled` reads the completed runs in the window, re-runs ONLY a cancelled
#   run with no later run of the same workflow on its branch, and reports every superseded one.
# Never: never cancels a run (a sweep that kills a 20-minute matrix is what it exists to undo), never
#   re-runs a superseded one, and never touches a `push` to main.
# dispatch: no inputs — the healer takes no target: it re-runs every cancelled run in the window that
# no later run of the same workflow superseded. The window is a make variable (WINDOW=2h), not
# a dispatch input.
on:
  schedule:
    - cron: "23,53 * * * *" # every 30 minutes, off the hour and off the other bots' minutes
  workflow_dispatch:

permissions:
  contents: read
  actions: write # `gh run rerun` is a write on the Actions API
  pull-requests: read

# a requeue round must never be cancelled by the next one - that is the bug this workflow heals
concurrency:
  group: ci-requeue
  cancel-in-progress: false

jobs:
  requeue:
    name: requeue
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
      - name: Re-run only the cancelled runs no later run superseded
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW: 2h
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make ci-requeue-cancelled
      - name: Say what the round could not decide
        if: always()
        run: |
          echo "window=2h target=ci-requeue-cancelled manual-equivalent=\"make ci-requeue-cancelled DRY=1\""
